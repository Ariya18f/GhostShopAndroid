plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghostshop.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ghostshop.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android framework WebView app – no extra libraries needed
}
